        function playSound(type) {
            if (!db.soundEffects) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                } else if (type === 'jump') {
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.2);
                } else {
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(180, ctx.currentTime + 0.15);
                }
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                osc.start(); osc.stop(ctx.currentTime + 0.35);
            } catch(e) {}
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            const found = db.users.find(u => u.email === email && u.password === pass);
            if (found) {
                db.currentUser = found;
                saveDB();
                renderApp();
            } else {
                alert('Email atau kata sandi salah. Coba gunakan demo akun.');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const nisn = document.getElementById('regNisn').value || '202499';
            const className = document.getElementById('regClass').value || 'X-IPS-1';
            const role = document.getElementById('regRole').value;
            const pass = document.getElementById('regPass').value;

            const newUser = {
                id: 'u_' + Date.now(),
                name, email, nisn, class: className, role,
                avatar: `https://placehold.co/150x150/14243D/C6A45C?text=${name.substring(0,2).toUpperCase()}`,
                password: pass,
                points: 1000
            };
            db.users.push(newUser);
            db.currentUser = newUser;
            saveDB();
            alert('Akun berhasil dibuat dan otomatis terdaftar!');
            renderApp();
        }

                            <div class="flex gap-2">

        }

            });

        // ==========================================
        // QUIZ LOGIC & CAMERA ATTENDANCE
        // ==========================================
        function answerQuiz(optIdx) {
            const qs = db.quizzes;
            const qsState = db.quizState;
            qsState.selectedAnswers[qsState.currentIdx] = optIdx;

            if (optIdx === qs[qsState.currentIdx].correct) {
                playSound('correct');
                confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } });
                qsState.mascotExpression = 'celebrating';
                qsState.mascotMessage = 'Hebat! Jawaban benar & maskot maju ke level berikutnya!';
            } else {
                playSound('wrong');
                qsState.mascotExpression = 'thinking';
                qsState.mascotMessage = 'Kurang tepat! Perhatikan pembahasan sejarah ya.';
            }

            if (qsState.currentIdx < qs.length - 1) {
                qsState.currentIdx++;
            } else {
                qsState.isCompleted = true;
                const correctCount = Object.keys(qsState.selectedAnswers).filter(idx => qsState.selectedAnswers[idx] === qs[idx].correct).length;
                const earnedPoints = correctCount * 10;
                db.currentUser.points = (db.currentUser.points || 1000) + earnedPoints;
                const lbEntry = db.leaderboard.find(l => l.name === db.currentUser.name);
                if (lbEntry) {
                    lbEntry.points += earnedPoints;
                } else {
                    db.leaderboard.push({ rank: db.leaderboard.length+1, name: db.currentUser.name, class: db.currentUser.class, points: 1000+earnedPoints, level: 'History Genius', avatar: db.currentUser.avatar, mascot: '🦊 Explorer' });
                }
                db.leaderboard.sort((a,b) => b.points - a.points);
                db.leaderboard.forEach((item, i) => item.rank = i+1);
            }
            saveDB();
            renderApp();
        }

        function resetQuiz() {
            db.quizState = { currentIdx: 0, score: 0, selectedAnswers: {}, isCompleted: false, mascotExpression: 'happy', mascotMessage: 'Ayo mulai game kartun kuis lagi!' };
            saveDB();
            renderApp();
        }

        let cameraStreamObj = null;
        async function startCamera() {
            const video = document.getElementById('cameraStream');
            const placeholder = document.getElementById('cameraPlaceholder');
            const btnCapture = document.getElementById('btnCapture');
            const btnStartCam = document.getElementById('btnStartCam');

            try {
                cameraStreamObj = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = cameraStreamObj;
                placeholder.classList.add('hidden');
                btnCapture.classList.remove('hidden');
                btnStartCam.classList.add('hidden');
            } catch(e) {
                alert('Kamera tidak tersedia atau izin ditolak.');
            }
        }

        function takeAttendancePhoto() {
            const video = document.getElementById('cameraStream');
            const canvas = document.getElementById('snapshotCanvas');
            const snapshotImage = document.getElementById('snapshotImage');
            const previewContainer = document.getElementById('snapshotPreviewContainer');
            const statusMsg = document.getElementById('attendanceStatusMsg');

            canvas.width = 320; canvas.height = 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, 320, 240);
            const photoData = canvas.toDataURL('image/png');

            snapshotImage.src = photoData;
            previewContainer.classList.remove('hidden');

            if (cameraStreamObj) {
                cameraStreamObj.getTracks().forEach(t => t.stop());
            }

            const now = new Date();
            db.attendance.unshift({
                id: 'att_' + Date.now(),
                studentId: db.currentUser.id,
                studentName: db.currentUser.name,
                nisn: db.currentUser.nisn,
                className: db.currentUser.class,
                date: now.toISOString().split('T')[0],
                time: now.toTimeString().split(' ')[0],
                photo: photoData,
                status: 'Hadir'
            });
            saveDB();
            statusMsg.innerHTML = '<span class="text-emerald-400 font-bold">Presensi berhasil dikirim dan tersinkron ke Guru!</span>';
        }

        function submitAssignment(asId) {
            db.submissions.unshift({
                id: 'sub_' + Date.now(),
                assignmentId: asId,
                studentId: db.currentUser.id,
                studentName: db.currentUser.name,
                nisn: db.currentUser.nisn,
                className: db.currentUser.class,
                fileName: 'Tugas_Sejarah_Siswa.pdf',
                date: '2026-10-31 09:00',
                status: 'Menunggu Penilaian',
                score: null,
                feedback: ''
            });
            saveDB();
            alert('Tugas berhasil dikirim ke portal Guru!');
            renderApp();
        }

        function gradeSubmission(subId) {
            const score = parseInt(document.getElementById('score_' + subId).value);
            const feedback = document.getElementById('feedback_' + subId).value;
            const sub = db.submissions.find(s => s.id === subId);
            if (sub) {
                sub.score = score;
                sub.feedback = feedback;
                sub.status = 'Sudah Dinilai';
                saveDB();
                alert('Nilai dan umpan balik berhasil disimpan dan disinkronkan ke Siswa!');
                renderApp();
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            if (!input || !input.value.trim()) return;
            const txt = input.value.trim();
            const now = new Date().toTimeString().split(' ')[0].substring(0,5);

            db.chats.push({
                id: 'c_' + Date.now(),
                sender: db.currentUser.name,
                role: db.currentUser.role,
                text: txt,
                time: now
            });

            if (txt.toLowerCase().includes('apa') || txt.toLowerCase().includes('siapa') || txt.toLowerCase().includes('jelaskan')) {
                db.chats.push({
                    id: 'ai_' + Date.now(),
                    sender: 'AI History Tutor',
                    role: 'ai',
                    text: `Halo ${db.currentUser.name}, berdasarkan Kurikulum Merdeka Sejarah Kelas X, pertanyaan tersebut berkaitan dengan materi Bab 1-5. Tetap semangat belajar!`,
                    time: now
                });
            }

            saveDB();
            input.value = '';
            renderApp();
        }

        function sendChatMessageTeacher() {
            const input = document.getElementById('chatInputTeacher');
            if (!input || !input.value.trim()) return;
            const txt = input.value.trim();
            const now = new Date().toTimeString().split(' ')[0].substring(0,5);

            db.chats.push({
                id: 'c_' + Date.now(),
                sender: db.currentUser.name,
                role: db.currentUser.role,
                text: txt,
                time: now
            });
            saveDB();
            input.value = '';
            renderApp();
        }
